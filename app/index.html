<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/app/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="PromptPearl AI turns your ideas into pictures, videos and cartoon episodes with voices, music and subtitles.">
  <meta name="theme-color" content="#06202B">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PromptPearl">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>PromptPearl AI</title>
  <style>
    html, body { margin: 0; height: 100%; background: #06202B; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #B8D8D4; }
    #loading img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 10px 40px rgba(124, 58, 237, .35);
      animation: pulse 1.6s ease-in-out infinite; }
    #loading p { margin: 0; font-size: 15px; letter-spacing: .2px; }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  </style>
</head>
<body>
  <div id="loading"><img src="icons/logo-160.png" alt="PromptPearl"><p>Loading PromptPearl AI…</p></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
